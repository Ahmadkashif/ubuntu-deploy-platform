# ubuntu-home-nat, verifiable WITHOUT a domain: identical topology (relay VPS: WireGuard + HAProxy send-proxy-v2;
# home: Caddy proxy_protocol allow <relay> reject; home firewall admits 80/443 only from the relay's tunnel IP) but TLS
# comes from Caddy's local CA instead of ACME. Verified with three disposable Ubuntu 26.04 KVM VMs
# (home 198.51.100.20, relay 198.51.100.30, internet client 198.51.100.50 / 2001:db8:5::50).
name: ubuntu-nat-verify
description: ubuntu-home-nat with a local CA instead of ACME — relay path verification without a public domain.
status: verified
platform: linux

minimum:
  os: [linux]
  arch: [amd64, arm64]
  ram_gb: 3.5
  cpu_cores: 2
  disk_free_gb: 25
  docker_major: 29
  notes: Relay VPS minimum 1 vCPU / 512 MB / public IPv4 (+IPv6), Ubuntu 24.04/26.04 with wireguard-tools + haproxy.

render:
  host: true
  relay: true

exposure:
  mode: relay
  bind_ip: 0.0.0.0
  http_port: 80
  https_port: 443
  domain: ship.test
  tls: internal
  acme_email: ""
  acme_staging: false
  proxy_protocol: true
  relay_wg_ip: 10.77.0.1
  hsts: max-age=300

edge:
  project: shipedge
  public_subnet: 203.0.113.0/24
  public_gateway: 203.0.113.1
  public_ipv6: true
  caddy_mem: 384m
  crowdsec_mem: 256m
  proxy_mem: 64m
  registry_mem: 128m

limits:
  rate_events: 300
  rate_window: 10s
  max_body: 10MB
  app_mem: 256m
  app_pids: 256
  app_cpus: 1.0

crowdsec:
  online_api: false
  appsec: true
  ticker: 5s
  whitelist: [198.51.100.0/28]

registry:
  bind: 127.0.0.1:5000
  push: localhost:5000

security:
  scan_fail_on: critical
  sign: true

firewall:
  uplink: eth0
  public_sources: [10.77.0.1]   # relay only
  ssh_iface: wg0
  lan_subnet: 198.51.100.0/28
  wg_port: 51820
  wg_subnet: 10.66.0.0/24
  host_wg_ip: 10.66.0.1

relay:
  public_iface: eth0
  wg_ip: 10.77.0.1
  home_wg_ip: 10.77.0.2
  wg_port: 51821

ci:
  runner_label: deploy
