# OWASP CRS 4.25.1 setup for public frontends (baked into the edge image).
# Anomaly scoring, blocking paranoia level 1, inbound threshold 5 (one critical rule blocks).
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
SecAction "id:900000,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.25.1',setvar:tx.blocking_paranoia_level=1"
SecAction "id:900110,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.25.1',setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"
# LTS 4.25.1 ships XML-attribute inspection behind an opt-in gate (GHSA-6jp8-c2w2-x7wr) — opt in.
SecAction "id:900510,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.25.1',setvar:tx.crs_xml_attr_inspect=1"
SecAction "id:900990,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.25.1',setvar:tx.crs_setup_version=4251"
